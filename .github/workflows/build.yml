name: Pustaka-FK Assembly Line
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Konfigurasi Mesin (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.2

    - name: Mulai Kompilasi (Assemble Debug)
      run: gradle assembleDebug
      
    - name: Ekspor Hasil APK
      uses: actions/upload-artifact@v4
      with:
        name: json-xml-tool-debug
        path: app/build/outputs/apk/debug/app-debug.apk
